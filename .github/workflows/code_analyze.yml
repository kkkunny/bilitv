name: Code Analyze

on:
  pull_request:
    branches: [ "master" ]

# pubspec.lock 中的依赖来自国内镜像源（pub.flutter-io.cn），
# CI 若使用默认的 pub.dev 会丢弃整份 lock 重新解析依赖，导致版本漂移。
env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  code_analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: make analyse

      - name: Test
        run: flutter test